[project]
name = "usd2mjcf"
version = "0.1.0"
description = "Convert OpenUSD physics assets (Isaac Sim / MjcPhysics / Newton schemas) into MuJoCo MJCF"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # Newton 的 USD 解析器 + SolverMuJoCo（后者就是把 Newton 模型写成 MJCF 的出口）
    # importers extra 提供 scipy / trimesh / coacd 等网格近似依赖 —— 缺了它们，
    # 碰撞体的凸包近似会静默退化成 bounding box（物理就错了）。
    "newton[importers]>=1.7,<2",
    "warp-lang>=1.17",
    # USD 运行时 + Newton 扩展 schema（newton:* 属性需要它注册）
    "usd-core>=25.5,<26.9",
    "newton-usd-schemas>=0.5.0",
    # 运行时与 mjlab 同源的 MuJoCo / MuJoCo Warp
    "mujoco~=3.15.0",
    "mujoco-warp~=3.15.0",
    "numpy>=2.0",
    "scipy>=1.11",
]

[project.scripts]
usd2mjcf = "usd2mjcf.cli:main"

[project.optional-dependencies]
# 离屏渲染验证（--render）用的图像编码
render = ["pillow>=11"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8", "pillow>=11"]

[tool.pytest.ini_options]
# 环境里若 source 过 ROS（PYTHONPATH 带 launch_testing），pytest 会自动加载它的
# 插件并因缺依赖直接崩掉；这里显式禁掉，与本工具无关。
addopts = "-p no:launch_testing -p no:launch_testing_ros_entrypoint -p no:launch_ros -p no:launch_pytest"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usd2mjcf"]
